<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Splash Cursor</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; color: #fff; font-family: monospace; }
        canvas { border: 1px solid #333; }
        .log { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="log" id="log"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');
        
        function addLog(msg) {
            log.innerHTML += '<br>' + msg;
            console.log(msg);
        }

        canvas.width = 400;
        canvas.height = 300;

        const gl = canvas.getContext('webgl');
        
        if (!gl) {
            addLog('ERROR: WebGL not supported');
            throw new Error('WebGL required');
        }
        addLog('WebGL context created');

        const vs = `
            attribute vec2 aPos;
            void main() { gl_Position = vec4(aPos, 0, 1); }
        `;

        const fs = `
            precision mediump float;
            void main() { gl_FragColor = vec4(0.0, 0.5, 1.0, 1.0); }
        `;

        function compile(type, src) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, src);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                addLog('Shader error: ' + gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        const vertexShader = compile(gl.VERTEX_SHADER, vs);
        const fragmentShader = compile(gl.FRAGMENT_SHADER, fs);
        
        if (!vertexShader || !fragmentShader) {
            addLog('Failed to compile shaders');
        } else {
            addLog('Shaders compiled');
        }

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            addLog('Link error: ' + gl.getProgramInfoLog(program));
        } else {
            addLog('Program linked');
        }

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, -1,1, 1,1, 1,-1]), gl.STATIC_DRAW);
        
        gl.useProgram(program);
        const loc = gl.getAttribLocation(program, 'aPos');
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(loc);

        gl.clearColor(0.1, 0.1, 0.1, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_FAN, 0, 4);
        
        addLog('Drawing complete');

        const floatExt = gl.getExtension('OES_texture_float');
        addLog('OES_texture_float: ' + (floatExt ? 'YES' : 'NO'));
    </script>
</body>
</html>
