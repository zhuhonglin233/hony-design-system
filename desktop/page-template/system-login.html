<html lang="zh-CN">
<head>    <meta charset="UTF-8">

    <script src="../../overall/js/common.js"></script>
    <!-- 组件库 CSS 文件 -->
    <link rel="stylesheet" href="../A-system/button.css">
    <link rel="stylesheet" href="../A-system/card.css">
    <link rel="stylesheet" href="../A-system/image.css">
    <link rel="stylesheet" href="../A-system/tab.css">
    <link rel="stylesheet" href="../B-navigation/Multi.css">
    <link rel="stylesheet" href="../B-navigation/Pagination.css">
    <link rel="stylesheet" href="../B-navigation/breadcrumb.css">

    <link rel="stylesheet" href="../C-input/upload.css">

    <link rel="stylesheet" href="../D-display/badge.css">
    <link rel="stylesheet" href="../D-display/calendar.css">
    <link rel="stylesheet" href="../D-display/comment.css">
    <link rel="stylesheet" href="../D-display/descriptions.css">
    <link rel="stylesheet" href="../D-display/list.css">
    <link rel="stylesheet" href="../D-display/table-tree.css">
    <link rel="stylesheet" href="../D-display/table.css">
    <link rel="stylesheet" href="../D-display/timeline.css">
    <link rel="stylesheet" href="../E-popup/alert.css">
    <link rel="stylesheet" href="../E-popup/modal.css">
    <link rel="stylesheet" href="../E-popup/popconfirm.css">
    <link rel="stylesheet" href="system-login.css">
    <link rel="stylesheet" href="system-table.css"></head>
<body>
    <div class="login-container">
        <!-- 左侧背景区域 -->
        <div class="login-left">
            <video class="login-bg-video" autoplay muted loop playsinline>
                <source src="../../overall/images/背景banne.mp4" type="video/mp4">
            </video>
        </div>
        
        <!-- 右侧登录区域 -->
        <div class="login-right">
            <div class="login-form">
                <!-- Logo 和标题 -->
                <div class="login-header">
                    <img src="../../overall/images/LOGO.png" alt="Hony Design Logo" class="login-logo">
                    <span class="login-title">Hony Design</span>
                </div>
                
                <!-- 登录标签页 -->
                <div class="hony-tab-nav" style="--line-left: 0px; --line-width: 68px;">
                    <div class="hony-tab-item active" data-tab="tab1" onclick="switchTab(this)">用户登录</div>
                    <div class="hony-tab-item" data-tab="tab2" onclick="switchTab(this)">手机登录</div>
                    <div class="hony-tab-item" data-tab="tab3" onclick="switchTab(this)">二维码登录</div>
                </div>
                
                <!-- 登录内容容器 -->
                <div class="hony-login-content">
                    <!-- 用户登录内容 -->
                    <div id="hony-tab1" class="hony-tab-content-item active">
                        <div class="login-input-group1">
                            <div class="hony-input-container">
                                <input type="text" id="username-input" required>
                                <label for="username-input" class="hony-label">用户名称</label>
                                <div class="hony-underline"></div>
                            </div>
                        </div>
                        
                        <div class="login-input-group2">
                            <div class="hony-input-container">
                                <input type="password" id="password-input" required>
                                <label for="password-input" class="hony-label">登录密码</label>
                                <div class="hony-underline"></div>
                                <div class="hony-input-action-btn" onclick="togglePassword()">
                                    <span class="hony-input-suffix iconfont hony-password-toggle" id="password-icon">&#xf082;</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="login-options">
                            <div class="hony-checkbox-item" id="remember-checkbox">
                                <div class="hony-checkbox-box"></div>
                                <span class="hony-checkbox-text">记住密码</span>
                            </div>
                            <button class="hony-btn hony-btn-link hony-btn-secondary login-text-btn">忘记密码？</button>
                        </div>
                        
                        <button class="hony-btn hony-btn-primary hony-btn-lg login-btn" onclick="window.location.href='system-home.html'">登录</button>
                    </div>
                    
                    <!-- 手机登录内容 -->
                    <div id="hony-tab2" class="hony-tab-content-item">
                        <div class="login-input-group1">
                            <div class="hony-input-container">
                                <input type="text" id="username-input" required>
                                <label for="username-input" class="hony-label">手机号码</label>
                                <div class="hony-underline"></div>
                            </div>
                        </div>
                        
                        <div class="login-input-group2">
                            <div class="hony-input-container">
                                <input type="text" id="code-input" required>
                                <label for="code-input" class="hony-label">验证码</label>
                                <div class="hony-underline"></div>
                                <div class="hony-input-Captcha"><button class="hony-btn hony-btn-link hony-btn-secondary" id="get-code-btn" onclick="startCountdown(this)">获取验证码</button></div>
                            </div>
                        </div>
                        
                        <button class="hony-btn hony-btn-primary hony-btn-lg login-btn" onclick="window.location.href='system-home.html'">登录</button>
                    </div>
                    
                    <!-- 二维码登录内容 -->
                    <div id="hony-tab3" class="hony-tab-content-item">
                        <div class="login-qrcode">
                            <img src="img/登录二维码.png" alt="登录二维码" class="qrcode-image">
                            <p class="qrcode-text">使用扫码登录</p>
                            <p class="qrcode-hint">请使用App扫描二维码</p>
                        </div>
                    </div>
                </div>
                
                <!-- 其他登录方式 -->
                <div class="login-other">
                    <div class="login-divider">
                        <span class="login-divider-line"></span>
                        <span class="login-divider-text">其他登录方式</span>
                        <span class="login-divider-line"></span>
                    </div>
                    
                    <div class="login-social">
                        <button class="login-social-btn" title="微信登录">
                            <img src="img/微信登录.png" alt="微信">
                        </button>
                        <button class="login-social-btn" title="QQ登录">
                            <img src="img/QQ登录.png" alt="QQ">
                        </button>
                        <button class="login-social-btn" title="Google登录">
                            <img src="img/谷歌登录.png" alt="Google">
                        </button>
                        <button class="login-social-btn" title="Apple登录">
                            <img src="img/苹果登录.png" alt="Apple">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>  
    <!-- 登录页脚本 -->
    <script>
        // 密码切换
        function togglePassword() {
            var passwordInput = document.getElementById('password-input');
            var passwordIcon = document.getElementById('password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerHTML = '&#xf083;';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerHTML = '&#xf082;';
            }
        }
        
        // 验证码倒计时
        var countdownTimer = null;
        function startCountdown(btn) {
            if (countdownTimer) return;
            
            var count = 60;
            btn.disabled = true;
            btn.classList.add('disabled');
            
            function updateCountdown() {
                if (count > 0) {
                    btn.textContent = count + 's后重试';
                    count--;
                } else {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    btn.disabled = false;
                    btn.classList.remove('disabled');
                    btn.textContent = '获取验证码';
                }
            }
            
            updateCountdown();
            countdownTimer = setInterval(updateCountdown, 1000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定复选框点击事件
            var checkbox = document.getElementById('remember-checkbox');
            if (checkbox) {
                checkbox.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var checkboxBox = this.querySelector('.hony-checkbox-box');
                    if (checkboxBox.classList.contains('checked')) {
                        checkboxBox.classList.remove('checked');
                        this.classList.remove('hony-checkboxed');
                    } else {
                        checkboxBox.classList.add('checked');
                        this.classList.add('hony-checkboxed');
                    }
                });
            }
        });
    </script>

</body>
</html>
