    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 等待DOM完全渲染后再初始化图表
            setTimeout(function() {
                // 今日图表 - 数据变化更大，范围0-1200
                initChart('main-chart', [200, 600, 1000, 1200, 500, 300]);
                
                // 本周图表 - 数据变化更大，范围0-1200
                initChart('chart-week', [100, 450, 800, 1150, 700, 250]);
                
                // 本月图表 - 数据变化更大，范围0-1200
                initChart('chart-month', [150, 500, 900, 1200, 600, 350]);
                
                // 本年图表
                initChart('chart-year', [3000, 4200, 5500, 6200, 5800, 4800], 7000);
            }, 100);
        });
        
        function initChart(chartId, data, maxValue = 1200) {
            var chartDom = document.getElementById(chartId);
            if (!chartDom) return;
            
            var myChart = echarts.init(chartDom);
            
            // 强制刷新尺寸
            setTimeout(function() {
                myChart.resize();
            }, 200);
            
            var option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#ffffff',
                    borderColor: '#e7eaf0',
                    borderWidth: 1,
                    textStyle: {
                        color: '#333'
                    },
                    formatter: function(params) {
                        var data = params[0];
                        return '<div style="padding: 8px;"><div style="font-size: 16px; font-weight: 600; color: #165dff; margin-bottom: 4px;">¥' + data.value + '</div><div style="font-size: 12px; color: #6c7da3;">' + data.name + '</div></div>';
                    }
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '12%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: ['星光学校', '西施附属中学', '星光学校', '星光学校', '星光学校', '星光学校'],
                    axisLine: {
                        lineStyle: {
                            color: '#e7eaf0'
                        }
                    },
                    axisLabel: {
                        color: '#6c7da3',
                        fontSize: 12,
                        interval: 0
                    },
                    axisTick: {
                        show: false,
                        alignWithLabel: true
                    }
                },
                yAxis: {
                    type: 'value',
                    max: maxValue,
                    min: 0,
                    interval: maxValue / 4,
                    axisLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        color: '#6c7da3',
                        fontSize: 12
                    },
                    splitLine: {
                        lineStyle: {
                            color: '#e7eaf0',
                            type: 'dashed'
                        }
                    }
                },
                series: [
                    {
                        name: '金额',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        lineStyle: {
                            width: 3,
                            color: '#165dff'
                        },
                        itemStyle: {
                            color: '#ffffff',
                            borderColor: '#165dff',
                            borderWidth: 2
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(22, 93, 255, 0.3)' },
                                { offset: 1, color: 'rgba(22, 93, 255, 0.05)' }
                            ])
                        },
                        emphasis: {
                            itemStyle: {
                                color: '#165dff',
                                borderColor: '#165dff',
                                borderWidth: 0
                            }
                        },
                        data: data
                    }
                ]
            };
            
            myChart.setOption(option);
            
            // 响应式调整
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        }

        // 当前要删除的行
        let currentDeleteRow = null;
        // 当前查看/编辑的行
        let currentViewRow = null;

        // 查看详情
        function viewDetail(rowElement) {
            currentViewRow = rowElement;
            const cells = rowElement.querySelectorAll('td');
            document.getElementById('detail-name').textContent = cells[0].textContent;
            document.getElementById('detail-age').textContent = cells[1].textContent;
            document.getElementById('detail-address').textContent = cells[2].textContent;
            document.getElementById('detail-balance').textContent = cells[3].textContent;
            document.getElementById('detail-tag').textContent = cells[4].textContent;
            
            // 确保显示查看模式
            document.getElementById('drawer-view-mode').style.display = 'block';
            document.getElementById('drawer-edit-mode').style.display = 'none';
            document.getElementById('drawer-footer').style.display = 'flex';
            document.getElementById('drawer-footer-edit').style.display = 'none';
            
            openDrawer('detail-drawer');
        }

        // 进入编辑模式
        function enterEditMode() {
            // 将查看模式的数据填入表单
            document.getElementById('edit-name').value = document.getElementById('detail-name').textContent;
            document.getElementById('edit-age').value = document.getElementById('detail-age').textContent;
            document.getElementById('edit-address').value = document.getElementById('detail-address').textContent;
            document.getElementById('edit-balance').value = document.getElementById('detail-balance').textContent;
            document.getElementById('edit-tag').value = document.getElementById('detail-tag').textContent;
            
            // 切换到编辑模式
            document.getElementById('drawer-view-mode').style.display = 'none';
            document.getElementById('drawer-edit-mode').style.display = 'block';
            document.getElementById('drawer-footer').style.display = 'none';
            document.getElementById('drawer-footer-edit').style.display = 'flex';
        }

        // 取消编辑
        function cancelEdit() {
            // 切换回查看模式
            document.getElementById('drawer-view-mode').style.display = 'block';
            document.getElementById('drawer-edit-mode').style.display = 'none';
            document.getElementById('drawer-footer').style.display = 'flex';
            document.getElementById('drawer-footer-edit').style.display = 'none';
        }

        // 保存编辑
        function saveEdit() {
            // 获取表单数据
            const name = document.getElementById('edit-name').value;
            const age = document.getElementById('edit-age').value;
            const address = document.getElementById('edit-address').value;
            const balance = document.getElementById('edit-balance').value;
            const tag = document.getElementById('edit-tag').value;
            
            // 更新查看模式的数据
            document.getElementById('detail-name').textContent = name;
            document.getElementById('detail-age').textContent = age;
            document.getElementById('detail-address').textContent = address;
            document.getElementById('detail-balance').textContent = balance;
            document.getElementById('detail-tag').textContent = tag;
            
            // 更新表格数据
            if (currentViewRow) {
                const cells = currentViewRow.querySelectorAll('td');
                cells[0].textContent = name;
                cells[1].textContent = age;
                cells[2].textContent = address;
                cells[3].textContent = balance;
                cells[4].textContent = tag;
            }
            
            // 切换回查看模式
            cancelEdit();
            alert('保存成功');
        }

        // 删除确认
        function confirmDelete() {
            console.log('confirmDelete called, currentDeleteRow:', currentDeleteRow);
            if (currentDeleteRow) {
                currentDeleteRow.remove();
                currentDeleteRow = null;
                closeModal('delete-modal');
                alert('删除成功');
            } else {
                console.error('currentDeleteRow 为空，无法删除');
                closeModal('delete-modal');
                alert('删除失败，未找到要删除的行');
            }
        }

        // 打开新增弹窗
        function openAddModal() {
            // 清空表单
            document.getElementById('add-name').value = '';
            document.getElementById('add-age').value = '';
            document.getElementById('add-address').value = '';
            document.getElementById('add-balance').value = '';
            document.getElementById('add-tag').value = '';
            openModal('add-modal');
        }

        // 保存新增
        function saveAdd() {
            // 获取表单数据
            const name = document.getElementById('add-name').value;
            const age = document.getElementById('add-age').value;
            const address = document.getElementById('add-address').value;
            const balance = document.getElementById('add-balance').value;
            const tag = document.getElementById('add-tag').value;
            
            // 验证必填项
            if (!name || !age) {
                alert('请填写姓名和年龄');
                return;
            }
            
            // 创建新行
            const table = document.querySelector('table');
            const tbody = table.querySelector('tbody') || table;
            
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td class="hony-sticky-left">${name}</td>
                <td>${age}</td>
                <td>${address}</td>
                <td>${balance}</td>
                <td><div class="hony-tab hony-tab-primary-light">${tag}</div></td>
                <td class="hony-sticky-right">
                    <div class="hony-sticky-right-line">
                        <button class="hony-btn hony-btn-link">查看</button>
                        <button class="hony-btn hony-btn-link hony-btn-danger">删除</button>
                    </div>
                </td>
            `;
            
            // 添加到表格末尾
            tbody.appendChild(newRow);
            
            // 为新添加的行绑定事件
            initTableButtons();
            
            // 关闭弹窗
            closeModal('add-modal');
            alert('新增成功');
        }

        // 打开导入/导出弹窗
        function openImportExportModal() {
            openModal('import-export-modal');
        }

        // 初始化表格按钮事件
        function initTableButtons() {
            // 为所有"查看"按钮添加点击事件（只绑定一次）
            document.querySelectorAll('.hony-btn-link:not(.hony-btn-danger)').forEach(function(btn) {
                if (!btn.dataset.viewBound) {
                    btn.dataset.viewBound = 'true';
                    btn.onclick = function() {
                        const row = this.closest('tr');
                        if (row) {
                            viewDetail(row);
                        }
                    };
                }
            });

            // 为表格中的"删除"按钮添加点击事件（排除弹窗中的按钮，只绑定一次）
            document.querySelectorAll('table button.hony-btn-danger').forEach(function(btn) {
                if (!btn.dataset.deleteBound) {
                    btn.dataset.deleteBound = 'true';
                    btn.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        currentDeleteRow = this.closest('tr');
                        console.log('currentDeleteRow:', currentDeleteRow);
                        if (currentDeleteRow) {
                            openModal('delete-modal');
                        } else {
                            console.error('未找到要删除的行');
                        }
                    };
                }
            });
        }

        // 页面加载后初始化按钮事件
        document.addEventListener('DOMContentLoaded', function() {
            initTableButtons();
        });

        // 如果页面已经加载完成，手动初始化
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(initTableButtons, 100);
        }
    </script>
