<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气泡 - 桌面端组件</title>
    <link rel="icon" href="../../overall/images/LOGO.png" type="image/png">
    <link rel="stylesheet" href="../../overall/main.css">
    <link rel="stylesheet" href="../../overall/icons/iconfont.css">
      <link rel="stylesheet" href="./alert.css">
    <link rel="stylesheet" href="./button.css">
    <link rel="stylesheet" href="./popconfirm.css">
    <script src="../../overall/js/common.js"></script>
<link rel="stylesheet" href="../B-navigation/tabs.css">
</head>
<body>
    <div class="page-container">
        <!-- 左侧导航 -->
        <div id="sidebar-container"></div>      
        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div id="navbar-container"></div>
            <!-- 主内容区域 -->
            <div class="hony-content-area">
                <!-- 页面标题 -->
                <div class="page-header">
                    <div class="design-code">design code 桌面端组件</div>
                    <div class="page-title">气泡</div>
                    <div class="page-description">气泡确认框用于对操作进行二次确认，支持多种图标和自定义按钮。</div>
                </div>            
                <div class="main-content-area">
                    <!-- 内容 -->
                    <div class="content-area">
                        <div class="content-main">

                        <!-- 气泡对话框 -->
                        <div class="section" id="popconfirm-bubble">
                            <div class="section-title">气泡<span style="color: var(--primary-main-1);">对话框</span></div>
                            <div class="subsection">
                                <div class="subsection-title">基础气泡</div>
                                <div class="subsection-description">气泡确认框用于对操作进行二次确认，支持多种图标和自定义按钮。</div>
                                <div class="component-container" style="padding: 20px;">
                                    <button class="hony-btn hony-btn-outline-secondary" onclick="showPopconfirm('pop1')">确认删除</button>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>                
                    <!-- 右侧锚点导航 -->
                    <div class="right-nav">
                        <div class="right-nav-items">
                            <div class="right-nav-item active" onclick="handleRightNavClick(this, 'popconfirm-bubble');">气泡对话框</div>
                        </div>
                    </div>
                </div>                
            </div>

        </div>
    </div>
    <!-- 背景纹理 -->
    <div class="hony-background-texture"></div>
    <!-- 背景banner -->
    <div class="background-bgVideo">
        <!-- 浅色模式视频 -->
        <video class="background-bgVideo-video background-bgVideo-light" autoplay muted loop playsinline>
            <source src="../../overall/images/背景banne.mp4" type="video/mp4">
        </video>
        <!-- 深色模式图片 -->
        <img class="background-bgVideo-image background-bgVideo-dark" src="../../overall/images/bg-dark-mode.png" alt="深色背景">
    </div>
<script src="../B-navigation/tabs.js"></script>
