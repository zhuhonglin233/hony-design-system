<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多页签tab页 - 桌面端组件</title>
    <link rel="icon" href="../../overall/images/LOGO.png" type="image/png">
    <link rel="stylesheet" href="../../overall/main.css">
    <link rel="stylesheet" href="../../overall/icons/iconfont.css">
    <link rel="stylesheet" href="Multi.css">
    <script src="../../overall/js/common.js"></script>
<link rel="stylesheet" href="../B-navigation/tabs.css">
</head>
<body>
    <div class="page-container">
        <!-- 左侧导航 -->
        <div id="sidebar-container"></div>      
        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <div id="navbar-container"></div>
            <!-- 主内容区域 -->
            <div class="hony-content-area">
                <!-- 页面标题 -->
                <div class="page-header">
                    <div class="design-code">design code 桌面端组件</div>
                    <div class="page-title">多页签Tab页</div>
                    <div class="page-description">显示当前页面在系统层级结构的位置，并能返回之前任意层级的页面。</div>
                </div>               
                <div class="main-content-area">
                    <!-- 内容 -->
                    <div class="content-area">
                        <div class="content-main">
                            <!-- 页签样式 Section -->
                            <div class="section">
                                <div class="section-title">基础<span style="color: var(--primary-main-1);">样式</span></div>
                                
                                <!-- 多页签Tab页 -->
                                <div class="subsection" id="multi-tab-style1">
                                    <div class="subsection-title">样式一</div>
                                    <div class="subsection-description">多页签Tab页：支持多个标签页的管理，包含关闭、切换等操作，适用于多文档编辑场景。</div>
                                    <div class="component-container">
                                        <div class="multi-tab-section">
                                            <div class="multi-tab multi-tab-style1">
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-icon iconfont">&#xeb1a;</span>
                                                </div>
                                                <div class="multi-tab-item active">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- 多页签Tab页 -->
                                <div class="subsection" id="multi-tab-style2">
                                    <div class="subsection-title">样式二</div>
                                    <div class="subsection-description">多页签Tab页：支持多个标签页的管理，包含关闭、切换等操作，适用于多文档编辑场景。</div>
                                    <div class="component-container">
                                        <div class="multi-tab-section">
                                            <div class="multi-tab multi-tab-style2">
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-icon iconfont">&#xeb1a;</span>
                                                </div>
                                                <div class="multi-tab-item active">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                                <div class="multi-tab-item">
                                                    <span class="multi-tab-text">目录</span>
                                                    <span class="multi-tab-close iconfont">&#xf062;</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>                        
                            </div>
                        </div>
                    </div>                
                    <!-- 右侧锚点导航 -->
                    <div class="right-nav">
                        <div class="right-nav-items">
                                <div class="right-nav-item active" onclick="handleRightNavClick(this, 'multi-tab-style1');">样式一</div>
                                <div class="right-nav-item" onclick="handleRightNavClick(this, 'multi-tab-style2');">样式二</div>
                        </div>
                    </div>
                </div>                
            </div>

        </div>
    </div>
    <!-- 背景纹理 -->
    <div class="hony-background-texture"></div>
    <!-- 背景banner -->
    <div class="background-bgVideo">
        <!-- 浅色模式视频 -->
        <video class="background-bgVideo-video background-bgVideo-light" autoplay muted loop playsinline>
            <source src="../../overall/images/背景banne.mp4" type="video/mp4">
        </video>
        <!-- 深色模式图片 -->
        <img class="background-bgVideo-image background-bgVideo-dark" src="../../overall/images/bg-dark-mode.png" alt="深色背景">
    </div>
<script src="../B-navigation/tabs.js"></script>
</body>
</html>
