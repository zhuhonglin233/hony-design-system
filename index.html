<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI设计师组件库 - Hony Design</title>
    <link rel="stylesheet" href="overall/design-tokens.css">
    <link rel="stylesheet" href="overall/home.css">
    <script src="overall/js/common.js"></script>
</head>
<body>
    <div class="home-page">
        <!-- 背景banner -->
        <div class="background-banner">
            <video class="background-banner-video" autoplay muted loop playsinline>
                <source src="overall/images/背景banne.mp4" type="video/mp4">
            </video>
        </div>

        <!-- 顶部导航栏 -->
        <div id="navbar-container"></div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="hero-section">
                <div class="hero-content">
                    <h1 class="hero-title">UI设计师组件库</h1>
                    <h2 class="hero-subtitle">Hony Design</h2>
                    <div class="hero-buttons">
                        <button class="btn-primary">
                            <span class="btn-text">开始使用</span>
                        </button>

                    </div>
                </div>
            </div>

            <!-- 功能卡片区域 -->
            <div class="features-section">
                <div class="feature-card desktop-card">
                    <div class="card-header">
                        <h3 class="card-title">桌面端</h3>
                        <p class="card-description">样式查看</p>
                    </div>
                    <div class="card-content">
                        <div class="tech-item">
                            <div class="tech-icon design-icon"></div>
                            <span class="tech-name">桌面端V1.0</span>
                        </div>
                        <div class="tech-item">
                            <div class="tech-icon figma-icon"></div>
                            <span class="tech-name">Figma</span>
                        </div>
                    </div>
                </div>

                <div class="feature-card mobile-card">
                    <div class="card-header">
                        <h3 class="card-title">移动端</h3>
                        <p class="card-description">样式查看</p>
                    </div>
                    <div class="card-content">
                        <div class="tech-item">
                            <div class="tech-icon design-icon"></div>
                            <span class="tech-name">移动端V1.0</span>
                        </div>
                        <div class="tech-item">
                            <div class="tech-icon figma-icon"></div>
                            <span class="tech-name">Figma</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ellipse-2"></div>
    </div>
    
    <script>
        // 导航栏背景动态变化

    </script>
</body>
</html>
